<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Browser-tab icon: the site's eye, on a blue tile so it reads on light and dark tab bars alike -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a78d6"/>
      <stop offset="1" stop-color="#0d366b"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#6da7ec"/>
      <stop offset="0.6" stop-color="#2a78d6"/>
      <stop offset="1" stop-color="#184f95"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <path d="M4 32 C 16 13, 48 13, 60 32 C 48 51, 16 51, 4 32 Z" fill="#ffffff"/>
  <circle cx="32" cy="32" r="13" fill="url(#iris)"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#0d366b" stroke-width="1.6"/>
  <circle cx="32" cy="32" r="5.8" fill="#0b1f3a"/>
  <circle cx="36.4" cy="27.4" r="2.7" fill="#ffffff"/>
</svg>
